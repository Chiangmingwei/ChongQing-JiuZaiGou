                { seq: 31, time: "03:45", act: "安全抵达新加坡", imgKey: "flight", lat: 1.3644, lng: 103.9915, locationName: "新加坡樟宜机场" }
            ]}
        ];

        /* Photos come from photos/<eventId>.jpg, e.g. photos/d1-s3.jpg */
        const PHOTO_DIR = 'photos/';
        function photoSrc(eventId) {
            return PHOTO_DIR + eventId + '.jpg';
        }

        let currentView = 'timeline';
        let mapInstance = null;
        let mapLayerGroup = null;

        function showToast(msg, ms = 3000) {
            document.getElementById('toast-text').innerText = msg;
            document.getElementById('toast').style.opacity = '1';
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => { document.getElementById('toast').style.opacity = '0'; }, ms);
        }

        function showPhotoHint(eventId) {
            showToast(`照片文件名：photos/${eventId}.jpg`, 4000);
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-render-target');
            let html = '';

            itineraryData.forEach((day) => {
                const dateDisplay = new Date(day.dateStr).toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' });

                html += `
                <div class="timeline-item" id="${day.id}">
                    <div class="timeline-content bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow">
                        <div class="bg-gradient-to-r from-emerald-50 to-teal-50 p-4 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <span class="bg-emerald-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm mr-2">第 ${day.day} 天</span>
                                <span class="text-xs font-semibold text-gray-500">${dateDisplay} (${day.weekday})</span>
                                <h3 class="text-base sm:text-lg font-bold text-gray-800 mt-1">${day.title}</h3>
                            </div>
                            <div class="weather-badge flex items-center bg-white px-3 py-2 rounded-xl shadow-sm border border-emerald-100 max-w-full sm:max-w-none">
                                <i class="fa-solid ${day.weather.icon} text-emerald-500 text-xl mr-3"></i>
                                <div class="text-left">
                                    <div class="text-[0.625rem] text-gray-500">${day.weather.condition}</div>
                                    <div class="text-xs font-bold text-gray-800">
                                        <i class="fa-solid fa-temperature-half text-orange-400 w-3"></i> ${day.weather.temp}
                                        <span class="mx-1 text-gray-300">|</span>
                                        <i class="fa-solid fa-droplet text-blue-400 w-3"></i> ${day.weather.rain}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 space-y-4">
                `;

                day.events.forEach((ev) => {
                    const eventId = `d${day.day}-s${ev.seq}`;

                    html += `
                            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-100">
                                <div class="flex items-center w-full sm:w-auto flex-grow">
                                    <div class="flex-shrink-0 w-12 text-emerald-600 font-bold text-xs sm:text-sm text-center">${ev.time}</div>
                                    <div class="mx-3 flex-shrink-0 w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 shadow-sm text-xs font-bold">${ev.seq}</div>
                                    <div class="text-xs sm:text-sm font-medium text-gray-800 break-words flex-grow">
                                        ${ev.act}
                                        <div class="text-[0.625rem] text-gray-400 mt-0.5"><i class="fa-solid fa-location-dot text-emerald-500 mr-1"></i>${ev.locationName}</div>
                                        <div class="wx-tl text-[0.625rem] text-sky-700 mt-0.5" data-stop="${eventId}"></div>
                                    </div>
                                </div>

                                <div class="w-full sm:w-36 h-40 sm:h-24 rounded-xl overflow-hidden flex-shrink-0 shadow-sm mt-2 sm:mt-0 relative group border border-gray-200 bg-gray-100 cursor-pointer" onclick="showPhotoHint('${eventId}')">
                                    <img src="${photoSrc(eventId)}" alt="${ev.locationName}" loading="lazy" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500" onerror="this.onerror=null;this.src=unsplashImages['${ev.imgKey}']">
                                </div>
                            </div>
                    `;
                });

                html += `</div></div></div>`;
            });

            container.innerHTML = html;
            // Fill each event's forecast at its arrival time (same Open-Meteo data as the map)
            container.querySelectorAll('.wx-tl').forEach(el => {
                const s = allStops.find(x => x.id === el.dataset.stop);
                if (s) renderWeather(s, el, false);
            });
        }

        /* ===== Map: stop-by-stop camera + animated route ===== */
        const dayCities = ['重庆', '成都', '黄龙', '九寨', '返蓉', '成都', '回渝', '抵家'];
        const allStops = [];
        itineraryData.forEach(d => d.events.forEach((ev, i) => allStops.push({ ...ev, day: d.day, dayIdx: i, dayObj: d, id: `d${d.day}-s${ev.seq}` })));
        const dayFirst = {}, dayCount = {};
        allStops.forEach((s, i) => { if (!(s.day in dayFirst)) dayFirst[s.day] = i; dayCount[s.day] = (dayCount[s.day] || 0) + 1; });

        function kmBetween(a, b) {
            const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
            return 12742 * Math.asin(Math.sqrt(h));
        }
        // Quadratic Bezier that bows slightly sideways, so each leg is a soft curve
        function arcPoints(a, b, n) {
            const cLat = (a.lat + b.lat) / 2 - (b.lng - a.lng) * 0.15, cLng = (a.lng + b.lng) / 2 + (b.lat - a.lat) * 0.15, pts = [];
            for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; pts.push([u * u * a.lat + 2 * u * t * cLat + t * t * b.lat, u * u * a.lng + 2 * u * t * cLng + t * t * b.lng]); }
            return pts;
        }
        // One long smooth path through every stop; stopPtIdx[i] = where stop i sits on it
        const routePts = [], stopPtIdx = [];
        allStops.forEach((s, i) => {
            if (i === 0) { routePts.push([s.lat, s.lng]); stopPtIdx.push(0); return; }
            const a = allStops[i - 1];
            (kmBetween(a, s) < 0.05 ? [[s.lat, s.lng]] : arcPoints(a, s, 48).slice(1)).forEach(p => routePts.push(p));
            stopPtIdx.push(routePts.length - 1);
        });

        let curIdx = 0, progress = 0, animId = null, shownDay = null, dayMarkers = [];
        let fullLine, progLine, headDot, dayLayer;

        function initLeafletMap() {
            mapInstance = L.map('map', { zoomControl: false }).setView([allStops[0].lat, allStops[0].lng], 11);
            mapInstance.on('popupopen', e => {
                const src = e.popup._source, el = e.popup.getElement();
                const slot = el && el.querySelector('.wx-slot');
                if (src && src.stop && slot) renderWeather(src.stop, slot, false);
            });
            L.control.zoom({ position: 'topright' }).addTo(mapInstance);
            L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                maxZoom: 18, minZoom: 4, attribution: '© AutoNavi'
            }).addTo(mapInstance);
            fullLine = L.polyline(routePts, { color: '#6b7280', weight: 3, opacity: 0.35, dashArray: '6, 8' }).addTo(mapInstance);
            progLine = L.polyline([routePts[0]], { color: '#059669', weight: 5, opacity: 0.9, lineCap: 'round' }).addTo(mapInstance);
            headDot = L.circleMarker(routePts[0], { radius: 7, color: '#fff', weight: 3, fillColor: '#f59e0b', fillOpacity: 1 }).addTo(mapInstance);
            dayLayer = L.layerGroup().addTo(mapInstance);
            goToStop(curIdx, true);
        }

        function drawProgress() {
            const k = Math.min(Math.floor(progress), routePts.length - 1), pts = routePts.slice(0, k + 1);
            if (k < routePts.length - 1) {
                const f = progress - k, a = routePts[k], b = routePts[k + 1];
                pts.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
            }
            progLine.setLatLngs(pts);
            headDot.setLatLng(pts[pts.length - 1]);
        }

        function stopIcon(s, active) {
            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="custom-marker${active ? ' active' : ''}" style="width: 32px; height: 32px; font-size: 0.8125rem;">${s.seq}</div>`,
                iconSize: [32, 32], iconAnchor: [16, 16]
            });
        }

        function popupHtml(s) {
            return `
                <div style="width: 210px; font-family: inherit;">
                    <img src="${photoSrc(s.id)}" style="width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 6px;" onerror="this.onerror=null;this.src=unsplashImages['${s.imgKey}']">
                    <div style="font-weight: bold; font-size: 0.8125rem; color: #111; margin-bottom: 2px;">第 ${s.day}天 · ${s.time}</div>
                    <div style="font-size: 0.6875rem; color: #4b5563; margin-bottom: 4px;">${s.act}</div>
                    <div style="font-size: 0.625rem; color: #10b981; font-weight: 600;"><i class="fa-solid fa-location-dot"></i> ${s.locationName}</div>
                    <div class="wx-slot" style="font-size: 0.6875rem; color: #0369a1; margin-top: 6px; padding: 6px 8px; background: #f0f9ff; border-radius: 8px;"></div>
                </div>`;
        }

        function renderDayMarkers(day) {
            dayLayer.clearLayers();
            dayMarkers = [];
            allStops.filter(s => s.day === day).forEach(s => {
                const m = L.marker([s.lat, s.lng], { icon: stopIcon(s, false) })
                    .bindPopup(popupHtml(s), { autoPan: false, offset: [0, -6] }).addTo(dayLayer);
                m.on('click', () => goToStop(allStops.indexOf(s)));
                m.stop = s;
                dayMarkers.push(m);
            });
            shownDay = day;
        }

        function renderTicks(id, items, active, onPick) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            items.forEach((it, i) => {
                const t = document.createElement('div');
                t.className = 'tick' + (i === active ? ' on' : '');
                t.style.left = `calc(8px + (100% - 16px) * ${items.length > 1 ? i / (items.length - 1) : 0.5})`;
                t.innerHTML = it.label + (it.sub ? `<em>${it.sub}</em>` : '');
                t.onclick = () => onPick(i);
                el.appendChild(t);
            });
        }

        function updateSliders(s) {
            const d = s.dayObj, n = dayCount[d.day];
            document.getElementById('slider-day-badge').innerText = `第 ${d.day} 天`;
            document.getElementById('slider-date-title').innerText = `${d.dateStr} (${d.weekday})`;
            document.getElementById('slider-day-title').innerText = d.title;
            document.getElementById('stop-title').innerText = `S${s.seq} · ${s.time} ${s.act}`;
            const ds = document.getElementById('day-slider'), ss = document.getElementById('stop-slider');
            ds.value = d.day;
            ss.min = 1; ss.max = Math.max(2, n); ss.value = s.dayIdx + 1; ss.disabled = n < 2;
            renderTicks('day-ticks', itineraryData.map(x => ({ label: `D${x.day}`, sub: dayCities[x.day - 1] })), d.day - 1, i => goToStop(dayFirst[i + 1]));
            renderTicks('stop-ticks', allStops.filter(x => x.day === d.day).map(x => ({ label: `S${x.seq}` })), s.dayIdx, i => goToStop(dayFirst[d.day] + i));
        }

        // Camera: fly to the stop, parked in the part of the map that is not hidden behind the control card
        function flyCam(s, dur) {
            const z = s.imgKey === 'flight' ? 11 : 13, size = mapInstance.getSize();
            const ty = (size.y - document.querySelector('.map-card').offsetHeight) * 0.6;
            const c = mapInstance.unproject(mapInstance.project([s.lat, s.lng], z).add([0, size.y / 2 - ty]), z);
            if (dur) mapInstance.flyTo(c, z, { duration: dur });
            else mapInstance.setView(c, z, { animate: false });
        }

        function goToStop(idx, instant) {
            idx = Math.max(0, Math.min(allStops.length - 1, idx));
            if (!mapInstance) { curIdx = idx; return; }
            const s = allStops[idx], prev = allStops[curIdx];
            if (idx === curIdx && !instant) { if (dayMarkers[s.dayIdx]) dayMarkers[s.dayIdx].openPopup(); return; }

            const quick = instant || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const dur = Math.min(3.2, 0.9 + 0.35 * Math.log(1 + kmBetween(prev, s) / 10));
            curIdx = idx;
            mapInstance.closePopup();
            if (shownDay !== s.day) renderDayMarkers(s.day);
            dayMarkers.forEach((m, i) => m.setIcon(stopIcon(allStops[dayFirst[s.day] + i], i === s.dayIdx)));
            updateSliders(s);

            cancelAnimationFrame(animId);
            const target = stopPtIdx[idx], start = progress, t0 = performance.now();
            const finish = () => { progress = target; drawProgress(); if (dayMarkers[s.dayIdx]) dayMarkers[s.dayIdx].openPopup(); };
            if (quick) { flyCam(s, 0); finish(); return; }
            flyCam(s, dur);
            const step = now => {
                const t = Math.min(1, (now - t0) / (dur * 1000));
                const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                progress = start + (target - start) * e;
                drawProgress();
                if (t < 1) animId = requestAnimationFrame(step); else finish();
            };
            animId = requestAnimationFrame(step);
        }

        /* ===== Weather: Open-Meteo hourly forecast per stop (Asia/Shanghai) ===== */
        const WX_TEXT = {0:'晴',1:'大致晴',2:'多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'阵雨',82:'强阵雨',95:'雷暴',96:'雷暴夹冰雹',99:'强雷暴夹冰雹'};
        function wxIcon(c) {
            if (c <= 1) return 'fa-sun'; if (c === 2) return 'fa-cloud-sun'; if (c === 3) return 'fa-cloud';
            if (c <= 48) return 'fa-smog'; if (c >= 71 && c <= 77) return 'fa-snowflake'; if (c >= 95) return 'fa-bolt';
            return 'fa-cloud-rain';
        }
        const wxCache = {};
        const tripStart = itineraryData[0].dateStr, tripEnd = itineraryData[itineraryData.length - 1].dateStr;
        function wxFor(s) {
            const key = s.lat.toFixed(3) + ',' + s.lng.toFixed(3);
            if (!wxCache[key]) {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lng}` +
                    `&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Asia%2FShanghai` +
                    `&start_date=${tripStart}&end_date=${tripEnd}`;
                wxCache[key] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                    .then(j => {
                        const m = {};
                        j.hourly.time.forEach((t, i) => m[t] = { temp: j.hourly.temperature_2m[i], pop: j.hourly.precipitation_probability[i], code: j.hourly.weather_code[i] });
                        return m;
                    }).catch(() => null);
            }
            return wxCache[key];
        }
        function wxCell(d) {
            return `<i class="fa-solid ${wxIcon(d.code)}"></i> ${Math.round(d.temp)}° <span class="text-sky-500">☂${d.pop}%</span>`;
        }
        // Fills a weather slot with the forecast at the stop's arrival hour, plus an hourly strip for the card
        async function renderWeather(s, el, detailed) {
            if (!el) return;
            const id = s.id;
            el.dataset.stop = id;
            el.innerHTML = '<span class="text-gray-400">天气加载中…</span>';
            const data = await wxFor(s);
            if (el.dataset.stop !== id) return;
            if (!data) { el.innerHTML = '<span class="text-gray-400">天气暂不可用</span>'; return; }
            const hh = s.time.slice(0, 2), at = data[`${s.dayObj.dateStr}T${hh}:00`];
            if (!at) { el.innerHTML = ''; return; }
            const label = `<b>${s.time}</b> ${WX_TEXT[at.code] || ''} · ${wxCell(at)}`;
            if (!detailed) { el.innerHTML = label; return; }
            let strip = '<div class="flex gap-1 overflow-x-auto mt-1 pb-0.5">';
            for (let hr = 6; hr <= 22; hr += 2) {
                const d = data[`${s.dayObj.dateStr}T${String(hr).padStart(2, '0')}:00`];
                if (d) strip += `<div class="flex-shrink-0 text-center bg-sky-50 rounded-md px-1.5 py-1 min-w-[46px]"><div class="text-[0.5625rem] text-gray-500">${String(hr).padStart(2, '0')}:00</div><div>${wxCell(d)}</div></div>`;
            }
            el.innerHTML = label + strip + '</div>';
        }

        function showDayOverview() {
            if (!mapInstance) return;
            const pts = allStops.filter(s => s.day === allStops[curIdx].day).map(s => [s.lat, s.lng]);
            mapInstance.closePopup();
            mapInstance.flyToBounds(L.latLngBounds(pts), {
                paddingTopLeft: [40, 60], paddingBottomRight: [40, document.querySelector('.map-card').offsetHeight + 30],
                duration: 1.4, maxZoom: 13
            });
        }

        function switchView(viewName) {
            currentView = viewName;
            const timelineView = document.getElementById('view-timeline');
            const mapView = document.getElementById('view-map');
            const btnTimeline = document.getElementById('btn-timeline');
            const btnMap = document.getElementById('btn-map');
            const activeCls = "px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-white text-emerald-600 shadow-sm flex items-center";
            const idleCls = "px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-gray-600 hover:text-gray-900 flex items-center";

            const slot = document.getElementById(viewName === 'timeline' ? 'toggle-slot-timeline' : 'toggle-slot-map');
            const tog = document.querySelector('.view-toggle');
            if (slot && tog) slot.appendChild(tog);
            const fsBar = document.querySelector('.fs-bar');
            if (fsBar) fsBar.style.display = viewName === 'timeline' ? '' : 'none';
            if (viewName === 'timeline') {
                timelineView.classList.remove('hidden');
                mapView.classList.add('hidden');
                btnTimeline.className = activeCls;
                btnMap.className = idleCls;
            } else {
                timelineView.classList.add('hidden');
                mapView.classList.remove('hidden');
                btnMap.className = activeCls;
                btnTimeline.className = idleCls;
                setTimeout(() => {
                    if (!mapInstance) initLeafletMap();
                    else mapInstance.invalidateSize();
                }, 150);
            }
        }

        function onDaySlider(v) { goToStop(dayFirst[parseInt(v)]); }
        function onStopSlider(v) { goToStop(dayFirst[allStops[curIdx].day] + parseInt(v) - 1); }
        function stepStop(d) { goToStop(curIdx + d); }

        function jumpToCurrentTime() {
            if (currentView !== 'map') switchView('map');
            setTimeout(() => goToStop(0), 400);
            showToast("已平滑飞至行程起点");
        }

        renderTimeline();
    </script>
    <div class="fs-bar" role="group" aria-label="字体大小">
        <button data-fs="1" onclick="setFontScale(1)">标准</button>
        <button data-fs="1.25" onclick="setFontScale(1.25)">大</button>
        <button data-fs="1.5" onclick="setFontScale(1.5)">特大</button>
        <button data-fs="1.75" onclick="setFontScale(1.75)">超大</button>
    </div>
    <script>
        function setFontScale(v) {
            document.documentElement.style.setProperty('--fs', v);
            document.querySelectorAll('.fs-bar button').forEach(b => b.classList.toggle('on', Number(b.dataset.fs) === v));
            try { localStorage.setItem('fontScale', v); } catch (e) {}
        }
        (function () {
            let saved = 1;
            try { saved = Number(localStorage.getItem('fontScale')) || 1; } catch (e) {}
            setFontScale(saved);
        })();
    </script>
</body>
</html>
