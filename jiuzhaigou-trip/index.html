    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.userUploadedImages = {};
        const myFirebaseConfig = null; // 可填入您自己的Firebase配置

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;

        async function initFirebase() {
            try {
                const localPhotos = localStorage.getItem('itinerary_photos');
                if (localPhotos) {
                    window.userUploadedImages = JSON.parse(localPhotos);
                    if (typeof window.renderTimeline === 'function') window.renderTimeline();
                }
            } catch(e) {}

            if (!firebaseConfig) {
                document.getElementById('sync-status').innerText = "本地离线模式 (仅本机可见)";
                return;
            }

            try {
                window.app = initializeApp(firebaseConfig);
                window.db = getFirestore(window.app);
                window.auth = getAuth(window.app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(window.auth, __initial_auth_token);
                } else {
                    await signInAnonymously(window.auth);
                }

                document.getElementById('sync-status').innerText = "云端已连接";
                const docRef = doc(window.db, 'artifacts', appId, 'public', 'itinerary_photos');
                
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data && data.images) {
                            window.userUploadedImages = { ...window.userUploadedImages, ...data.images };
                            localStorage.setItem('itinerary_photos', JSON.stringify(window.userUploadedImages));
                            
                            if (typeof window.renderTimeline === 'function') window.renderTimeline();
                            if (typeof window.renderMapForDay === 'function') {
                                window.renderMapForDay(document.getElementById('day-slider').value);
                            }
                        }
                    }
                }, () => { document.getElementById('sync-status').innerText = "云端同步断开"; });

            } catch (e) {
                document.getElementById('sync-status').innerText = "服务连接异常";
            }
        }

        window.saveImageToCloud = async function(eventId, base64Data) {
            window.userUploadedImages[eventId] = base64Data;
            try { localStorage.setItem('itinerary_photos', JSON.stringify(window.userUploadedImages)); } catch(e){}
            if (typeof window.renderTimeline === 'function') window.renderTimeline();
            if (typeof window.renderMapForDay === 'function') window.renderMapForDay(document.getElementById('day-slider').value);

            if (!window.db) {
                showToastMsg("图片已保存至本机！(配置云端即可分享)");
                return;
            }

            try {
                const docRef = doc(window.db, 'artifacts', appId, 'public', 'itinerary_photos');
                await setDoc(docRef, { images: { [eventId]: base64Data } }, { merge: true });
                showToastMsg("照片已成功同步至云端！");
            } catch (e) {
                showToastMsg("上传云端失败：图片可能仍偏大");
            }
        };

        initFirebase();
    </script>

        let currentView = 'timeline';
        let mapInstance = null;
        let mapLayerGroup = null;

        function triggerImageUpload(eventId) {
            const input = document.getElementById(`upload-${eventId}`);
            if (input) input.click();
        }

        function handleImageUpload(event, eventId) {
            const file = event.target.files[0];
            if (!file) return;

            showToastMsg("正在处理压缩图片...");
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_DIM = 800;
                    let w = img.width;
                    let h = img.height;

                    if (w > h && w > MAX_DIM) {
                        h = Math.round((h * MAX_DIM) / w); w = MAX_DIM;
                    } else if (h > MAX_DIM) {
                        w = Math.round((w * MAX_DIM) / h); h = MAX_DIM;
                    }

                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    if (window.saveImageToCloud) {
                        window.saveImageToCloud(eventId, compressedBase64);
                    }
                };
                img.onerror = () => showToastMsg("图片读取失败");
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function showToastMsg(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function switchView(viewName) {
            currentView = viewName;
            const timelineView = document.getElementById('view-timeline');
            const mapView = document.getElementById('view-map');
            const btnTimeline = document.getElementById('btn-timeline');
            const btnMap = document.getElementById('btn-map');

            if (viewName === 'timeline') {
                timelineView.classList.remove('hidden');
                mapView.classList.add('hidden');
                btnTimeline.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-white text-emerald-600 shadow-sm flex items-center";
                btnMap.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-gray-600 hover:text-gray-900 flex items-center";
            } else {
                timelineView.classList.add('hidden');
                mapView.classList.remove('hidden');
                btnMap.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-white text-emerald-600 shadow-sm flex items-center";
                btnTimeline.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-gray-600 hover:text-gray-900 flex items-center";
                
                setTimeout(() => {
                    if (!mapInstance) initLeafletMap();
                    else mapInstance.invalidateSize();
                }, 150);
            }
        }

        window.renderTimeline = function() {
            const container = document.getElementById('timeline-render-target');
            if (!container) return;
            let html = '';

            itineraryData.forEach((day) => {
                const dateObj = new Date(day.dateStr);
                const formatOpts = { month: 'long', day: 'numeric', weekday: 'short' };
                const dateDisplay = dateObj.toLocaleDateString('zh-CN', formatOpts);

                html += `
                <div class="timeline-item" id="${day.id}">
                    <div class="timeline-content bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow">
                        <div class="bg-gradient-to-r from-emerald-50 to-teal-50 p-4 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <span class="bg-emerald-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm mr-2">第 ${day.day} 天</span>
                                <span class="text-xs font-semibold text-gray-500">${dateDisplay} (${day.weekday})</span>
                                <h3 class="text-base sm:text-lg font-bold text-gray-800 mt-1">${day.title}</h3>
                            </div>
                            <div class="weather-badge flex items-center bg-white px-3 py-2 rounded-xl shadow-sm border border-emerald-100 min-w-max">
                                <i class="fa-solid ${day.weather.icon} text-emerald-500 text-xl mr-3"></i>
                                <div class="text-left">
                                    <div class="text-[10px] text-gray-500">${day.weather.condition}</div>
                                    <div class="text-xs font-bold text-gray-800">
                                        <i class="fa-solid fa-temperature-half text-orange-400 w-3"></i> ${day.weather.temp}
                                        <span class="mx-1 text-gray-300">|</span>
                                        <i class="fa-solid fa-droplet text-blue-400 w-3"></i> ${day.weather.rain}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 space-y-4">
                `;

                day.events.forEach((ev) => {
                    const uniqueEventId = `d${day.day}-s${ev.seq}`;
                    const currentImg = (window.userUploadedImages && window.userUploadedImages[uniqueEventId]) || (ev.imgKey && unsplashImages[ev.imgKey]);

                    html += `
                            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 p-3 rounded-xl hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-100">
                                <div class="flex items-center w-full sm:w-auto flex-grow">
                                    <div class="flex-shrink-0 w-12 text-emerald-600 font-bold text-xs sm:text-sm text-center">${ev.time}</div>
                                    <div class="mx-3 flex-shrink-0 w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 shadow-sm text-xs font-bold">${ev.seq}</div>
                                    <div class="text-xs sm:text-sm font-medium text-gray-800 break-words flex-grow">
                                        ${ev.act}
                                        <div class="text-[10px] text-gray-400 mt-0.5"><i class="fa-solid fa-location-dot text-emerald-500 mr-1"></i>${ev.locationName}</div>
                                    </div>
                                </div>
                            
                                <div class="w-full sm:w-36 h-24 rounded-xl overflow-hidden flex-shrink-0 shadow-sm mt-2 sm:mt-0 relative group border border-gray-200 bg-gray-100 flex items-center justify-center cursor-pointer" onclick="triggerImageUpload('${uniqueEventId}')" title="点击更改照片">
                                    <input type="file" id="upload-${uniqueEventId}" accept="image/*" class="hidden" onclick="event.stopPropagation()" onchange="handleImageUpload(event, '${uniqueEventId}')">
                                    <img src="${currentImg}" alt="scenic" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/400x300/10b981/ffffff?text=Scenic'">
                                    
                                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-white text-[10px] font-medium gap-1">
                                        <i class="fa-solid fa-cloud-arrow-up text-sm"></i> 更换照片
                                    </div>
                                </div>
                            </div>
                    `;
                });

                html += `</div></div></div>`;
            });

            container.innerHTML = html;
        };

        function initLeafletMap() {
            mapInstance = L.map('map', { zoomControl: false }).setView([29.5605, 106.5854], 11);
            L.control.zoom({ position: 'topright' }).addTo(mapInstance);
            L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
                maxZoom: 18, minZoom: 4, attribution: '© AutoNavi'
            }).addTo(mapInstance);
            mapLayerGroup = L.layerGroup().addTo(mapInstance);
            renderMapForDay(1);
        }

        window.renderMapForDay = function(dayNum) {
            if (!mapLayerGroup) return;
            mapLayerGroup.clearLayers();

            const targetDay = itineraryData.find(d => d.day === parseInt(dayNum));
            if (!targetDay) return;

            document.getElementById('slider-day-badge').innerText = `第 ${targetDay.day} 天`;
            document.getElementById('slider-date-title').innerText = `${targetDay.dateStr} (${targetDay.weekday})`;
            document.getElementById('slider-day-title').innerText = targetDay.title;

            const latLngs = [];

            targetDay.events.forEach((ev) => {
                const latLng = [ev.lat, ev.lng];
                latLngs.push(latLng);

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-marker" style="width: 32px; height: 32px; font-size: 13px; background: #10b981;">${ev.seq}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const uniqueEventId = `d${targetDay.day}-s${ev.seq}`;
                const currentImg = (window.userUploadedImages && window.userUploadedImages[uniqueEventId]) || (ev.imgKey && unsplashImages[ev.imgKey]);

                const popupContent = `
                    <div style="width: 210px; font-family: inherit;">
                        <img src="${currentImg}" style="width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 6px;" onerror="this.src='https://placehold.co/300x200/10b981/ffffff?text=Scenic'">
                        <div style="font-weight: bold; font-size: 13px; color: #111; margin-bottom: 2px;">第 ${targetDay.day}天 · ${ev.time}</div>
                        <div style="font-size: 11px; color: #4b5563; margin-bottom: 4px;">${ev.act}</div>
                        <div style="font-size: 10px; color: #10b981; font-weight: 600;"><i class="fa-solid fa-location-dot"></i> ${ev.locationName}</div>
                    </div>
                `;

                L.marker(latLng, { icon: customIcon }).bindPopup(popupContent).addTo(mapLayerGroup);
            });

            if (latLngs.length > 0) {
                const polyline = L.polyline(latLngs, { color: '#059669', weight: 5, opacity: 0.85, dashArray: '8, 8' }).addTo(mapLayerGroup);
                if (latLngs.length === 1) mapInstance.flyTo(latLngs[0], 13, { duration: 1.0 });
                else mapInstance.flyToBounds(polyline.getBounds(), { padding: [60, 60], duration: 1.0, maxZoom: 13 });
            }
        };

        function onSliderChange(val) { renderMapForDay(val); }

        function jumpToCurrentTime() {
            document.getElementById('day-slider').value = 1;
            if (currentView !== 'map') switchView('map');
            renderMapForDay(1);
            showToastMsg("已平滑平移至行程起点 (重庆)");
        }

        window.onload = function() { renderTimeline(); };
    </script>
</body>
</html>
